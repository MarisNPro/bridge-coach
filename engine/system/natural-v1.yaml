        min: 10
      length:
        clubs:
          min: 4
    call: 2C
    meaning: 'New suit at the 2-level: 10+ HCP, clubs, forcing one round.'
    promised:
      hcp:
        min: 10
      length:
        clubs:
          min: 4
  - id: r1s-2s
    conditions:
      hcp:
        min: 6
        max: 9
      length:
        spades:
          min: 3
    call: 2S
    meaning: 'Simple raise: 6-9 HCP, 3+ spades.'
    promised:
      hcp:
        min: 6
        max: 9
      length:
        spades:
          min: 3
  - id: r1s-1nt
    conditions:
      hcp:
        min: 6
        max: 10
      length:
        spades:
          max: 2
    call: 1NT
    meaning: 6-10 HCP, denies 3-card spade support, semi-forcing.
