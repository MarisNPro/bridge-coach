# Natural bidding system v1  ·  source: Natural Bidding Handbook (all sections)
# Uncontested sections 2-7 PLUS competitive sections 8-10. Opponents' calls in the
# auction are shown in (parentheses). Only `conditions` is executable; first match wins.
# Competitive coverage is concrete-per-opponent-suit; the opening x overcall negative-
# double matrix is representative (see schema.md).

id: natural-v1
name: Natural
hcp_scale:
  A: 4
  K: 3
  Q: 2
  J: 1
toggles:
  open_min_hcp: 12
  nt_range:
    min: 15
    max: 17
  nt2_range:
    min: 20
    max: 21
  strong_2c:
    min: 22
  weak2_range:
    min: 6
    max: 10
  nt_with_5card_major: true
situations:
- id: opening
  description: Opener's first call, uncontested.
  when:
    seat: opener
    auction: []
  rules:
  - id: open-2c
    conditions:
      hcp:
        min: 22
    call: 2C
    meaning: "Strong, artificial, forcing \u2014 22+ HCP, any shape. Says nothing about clubs."
    promised:
      hcp:
        min: 22
      artificial: true
      forcing: true
  - id: open-2nt
    conditions:
      hcp:
        min: 20
        max: 21
      balanced: true
    call: 2NT
    meaning: Balanced 20-21.
    promised:
      hcp:
        min: 20
        max: 21
      shape: balanced
  - id: open-1nt
    conditions:
      hcp:
        min: 15
        max: 17
      balanced: true
    call: 1NT
    meaning: Balanced 15-17 (a 5-card major is allowed).
    promised:
      hcp:
        min: 15
        max: 17
      shape: balanced
  - id: open-1s
    conditions:
      hcp:
        min: 12
      length:
        spades:
          min: 5
      compare:
      - left: spades
        op: ge
        right: hearts
    call: 1S
    meaning: 5+ spades, 12-21. With 5-5 majors, opens the higher (spades).
    promised:
      hcp:
        min: 12
        max: 21
      length:
        spades:
          min: 5
  - id: open-1h
    conditions:
      hcp:
        min: 12
      length:
        hearts:
          min: 5
      compare:
      - left: hearts
        op: ge
        right: spades
    call: 1H
    meaning: 5+ hearts, 12-21.
    promised:
      hcp:
        min: 12
        max: 21
      length:
        hearts:
          min: 5
  - id: open-1d-longer
    conditions:
      hcp:
        min: 12
      length:
        diamonds:
          min: 3
      compare:
      - left: diamonds
        op: gt
        right: clubs
    call: 1D
    meaning: No 5-card major; diamonds the longer minor.
    promised:
      hcp:
        min: 12
        max: 21
      length:
        diamonds:
          min: 3
      denies:
        five_card_major: true
  - id: open-1d-equal
    conditions:
      hcp:
        min: 12
      length:
        diamonds:
          min: 4
      compare:
      - left: diamonds
        op: ge
        right: clubs
      - left: clubs
        op: ge
        right: diamonds
    call: 1D
    meaning: "No 5-card major; 4-4 (or 5-5) minors \u2014 opens 1D by agreement."
    promised:
      hcp:
        min: 12
        max: 21
      length:
        diamonds:
          min: 4
      denies:
        five_card_major: true
  - id: open-1c
    conditions:
      hcp:
        min: 12
    call: 1C
    meaning: No 5-card major; clubs the longer minor, or 3-3 minors. Usually 3+ clubs.
    promised:
      hcp:
        min: 12
        max: 21
      length:
        clubs:
          min: 3
      denies:
        five_card_major: true
  - id: open-3c
    conditions:
      hcp:
        min: 6
        max: 9
      length:
        clubs:
          min: 7
    call: 3C
    meaning: 'Pre-empt: 7-card club suit, 6-9 HCP, weak defence.'
    promised:
      hcp:
        min: 6
        max: 9
      length:
        clubs:
          min: 7
  - id: open-3d
    conditions:
      hcp:
        min: 6
        max: 9
      length:
        diamonds:
          min: 7
    call: 3D
    meaning: 'Pre-empt: 7-card diamond suit, 6-9 HCP.'
    promised:
      hcp:
        min: 6
        max: 9
      length:
        diamonds:
          min: 7
  - id: open-3h
    conditions:
      hcp:
        min: 6
        max: 9
      length:
        hearts:
          min: 7
    call: 3H
    meaning: 'Pre-empt: 7-card heart suit, 6-9 HCP.'
    promised:
      hcp:
        min: 6
        max: 9
      length:
        hearts:
          min: 7
  - id: open-3s
    conditions:
      hcp:
        min: 6
        max: 9
      length:
        spades:
          min: 7
    call: 3S
    meaning: 'Pre-empt: 7-card spade suit, 6-9 HCP.'
    promised:
      hcp:
        min: 6
        max: 9
      length:
        spades:
          min: 7
  - id: open-2d
    conditions:
      hcp:
        min_ref: weak2_range.min
        max_ref: weak2_range.max
      length:
        diamonds:
          min: 6
          max: 6
        spades:
          max: 3
        hearts:
          max: 3
      top3_honors:
        suit: diamonds
        min: 2
    call: 2D
    meaning: 'Weak two: exactly 6 diamonds, 6-10 HCP, good suit, no side 4-card major.'
    promised:
      hcp:
        min: 6
        max: 10
      length:
        diamonds:
          min: 6
          max: 6
  - id: open-2h
    conditions:
      hcp:
        min_ref: weak2_range.min
        max_ref: weak2_range.max
      length:
        hearts:
          min: 6
          max: 6
        spades:
          max: 3
      top3_honors:
        suit: hearts
        min: 2
    call: 2H
    meaning: 'Weak two: exactly 6 hearts, 6-10 HCP, good suit, no side 4-card spades.'
    promised:
      hcp:
        min: 6
        max: 10
      length:
        hearts:
          min: 6
          max: 6
  - id: open-2s
    conditions:
      hcp:
        min_ref: weak2_range.min
        max_ref: weak2_range.max
      length:
        spades:
          min: 6
          max: 6
        hearts:
          max: 3
      top3_honors:
        suit: spades
        min: 2
    call: 2S
    meaning: 'Weak two: exactly 6 spades, 6-10 HCP, good suit, no side 4-card hearts.'
    promised:
      hcp:
        min: 6
        max: 10
      length:
        spades:
          min: 6
          max: 6
  - id: open-pass
    conditions:
      hcp:
        max: 11
    call: Pass
    meaning: Fewer than opening values and no pre-empt available.
    promised:
      hcp:
        max: 11
- id: resp-1c
  description: Responder after partner's 1C, uncontested.
  when:
    seat: responder
    auction:
    - 1C
    - Pass
  rules:
  - id: r1c-1d
    conditions:
      hcp:
        min: 6
      length:
        diamonds:
          min: 4
    call: 1D
    meaning: 4+ diamonds, 6+ HCP. Up the line, forcing one round.
    promised:
      hcp:
        min: 6
      length:
        diamonds:
          min: 4
  - id: r1c-1h
    conditions:
      hcp:
        min: 6
      length:
        hearts:
          min: 4
    call: 1H
    meaning: 4+ hearts, 6+ HCP, forcing one round.
    promised:
      hcp:
        min: 6
      length:
        hearts:
          min: 4
  - id: r1c-1s
    conditions:
      hcp:
        min: 6
      length:
        spades:
          min: 4
    call: 1S
    meaning: 4+ spades, 6+ HCP, forcing one round.
    promised:
      hcp:
        min: 6
      length:
        spades:
          min: 4
  - id: r1c-3c
    conditions:
      hcp:
        min: 10
        max: 12
      length:
        clubs:
          min: 5
    call: 3C
    meaning: 'Jump raise: 10-12 HCP, 5+ clubs, invitational.'
    promised:
      hcp:
        min: 10
        max: 12
      length:
        clubs:
          min: 5
  - id: r1c-2c
    conditions:
      hcp:
        min: 5
        max: 9
      length:
        clubs:
          min: 5
    call: 2C
    meaning: 'Single raise: 5-9 HCP, 5+ club support.'
    promised:
      hcp:
        min: 5
        max: 9
      length:
        clubs:
          min: 5
  - id: r1c-3nt
    conditions:
      hcp:
        min: 13
        max: 15
      balanced: true
    call: 3NT
    meaning: "13-15 balanced, no 4-card major \u2014 to play."
    promised:
      hcp:
        min: 13
        max: 15
      shape: balanced
  - id: r1c-2nt
    conditions:
      hcp:
        min: 11
        max: 12
      balanced: true
    call: 2NT
    meaning: "11-12 balanced, no 4-card major \u2014 invitational."
    promised:
      hcp:
        min: 11
        max: 12
      shape: balanced
  - id: r1c-1nt
    conditions:
      hcp:
        min: 6
        max: 10
      balanced: true
    call: 1NT
    meaning: 6-10 balanced, no 4-card major and no biddable 1-level suit.
    promised:
      hcp:
        min: 6
        max: 10
      shape: balanced
  - id: r1c-pass
    conditions:
      hcp:
        max: 5
    call: Pass
    meaning: Too weak to respond.
    promised:
      hcp:
        max: 5
  # Catch-alls: no four-card major and no biddable suit/raise above. Appended so
  # the specific responses above always win first (see vet.py — no null calls).
  - id: r1c-3nt-gameforce
    conditions:
      hcp:
        min: 13
    call: 3NT
    meaning: "13+ HCP, no four-card major and no suit worth forcing with — enough for game opposite the opening; to play 3NT."
    promised:
      hcp:
        min: 13
  - id: r1c-1nt-catchall
    conditions: {}
    call: 1NT
    meaning: "6-12, no four-card major and nothing better to say — natural, non-forcing."
    promised:
      hcp:
        min: 6
        max: 12
- id: resp-1d
  description: Responder after partner's 1D, uncontested.
  when:
    seat: responder
    auction:
    - 1D
    - Pass
  rules:
  - id: r1d-1h
    conditions:
      hcp:
        min: 6
      length:
        hearts:
          min: 4
    call: 1H
    meaning: 4+ hearts, 6+ HCP, forcing one round (up the line).
    promised:
      hcp:
        min: 6
      length:
        hearts:
          min: 4
  - id: r1d-1s
    conditions:
      hcp:
        min: 6
      length:
        spades:
          min: 4
    call: 1S
    meaning: 4+ spades, 6+ HCP, forcing one round.
    promised:
      hcp:
        min: 6
      length:
        spades:
          min: 4
  - id: r1d-2c
    conditions:
      hcp:
        min: 10
      length:
        clubs:
          min: 5
    call: 2C
    meaning: 'New suit at the 2-level: 10+ HCP, 5+ clubs, forcing.'
    promised:
      hcp:
        min: 10
      length:
        clubs:
          min: 5
  - id: r1d-3d
    conditions:
      hcp:
        min: 10
        max: 12
      length:
        diamonds:
          min: 5
    call: 3D
    meaning: 'Jump raise: 10-12 HCP, 5+ diamonds, invitational.'
    promised:
      hcp:
        min: 10
        max: 12
      length:
        diamonds:
          min: 5
  - id: r1d-2d
    conditions:
      hcp:
        min: 5
        max: 9
      length:
        diamonds:
          min: 5
    call: 2D
    meaning: 'Single raise: 5-9 HCP, 5+ diamond support.'
    promised:
      hcp:
        min: 5
        max: 9
      length:
        diamonds:
          min: 5
  - id: r1d-3nt
    conditions:
      hcp:
        min: 13
        max: 15
      balanced: true
    call: 3NT
    meaning: "13-15 balanced, no 4-card major \u2014 to play."
    promised:
      hcp:
        min: 13
        max: 15
      shape: balanced
  - id: r1d-2nt
    conditions:
      hcp:
        min: 11
        max: 12
      balanced: true
    call: 2NT
    meaning: "11-12 balanced, no 4-card major \u2014 invitational."
    promised:
      hcp:
        min: 11
        max: 12
      shape: balanced
  - id: r1d-1nt
    conditions:
      hcp:
        min: 6
        max: 10
      balanced: true
    call: 1NT
    meaning: 6-10 balanced, no 4-card major.
    promised:
      hcp:
        min: 6
        max: 10
      shape: balanced
  - id: r1d-pass
    conditions:
      hcp:
        max: 5
    call: Pass
    meaning: Too weak to respond.
    promised:
      hcp:
        max: 5
  # Catch-alls: no four-card major and no fit/forcing bid above. Appended so the
  # specific responses always win first (see vet.py — no null calls).
  - id: r1d-3nt-gameforce
    conditions:
      hcp:
        min: 13
    call: 3NT
    meaning: "13+ HCP, no four-card major and no suit worth forcing with — to play 3NT opposite the opening."
    promised:
      hcp:
        min: 13
  - id: r1d-1nt-catchall
    conditions: {}
    call: 1NT
    meaning: "6-12, no four-card major and too weak for a forcing 2-level bid — natural 1NT."
    promised:
      hcp:
        min: 6
        max: 12
- id: resp-1h
  description: Responder after partner's 1H (5+ hearts), uncontested.
  when:
    seat: responder
    auction:
    - 1H
    - Pass
  rules:
  - id: r1h-jacoby2nt
    conditions:
      hcp:
        min: 13
      length:
        hearts:
          min: 4
    call: 2NT
    meaning: 'Jacoby 2NT: game-forcing, 4+ hearts. Slam-investigation tool.'
    promised:
      hcp:
        min: 13
      length:
        hearts:
          min: 4
  - id: r1h-1s
    conditions:
      hcp:
        min: 6
      length:
        spades:
          min: 4
    call: 1S
    meaning: 'New suit at the 1-level: 4+ spades, 6+ HCP, forcing one round.'
    promised:
      hcp:
        min: 6
      length:
        spades:
          min: 4
  - id: r1h-3h
    conditions:
      hcp:
        min: 10
        max: 12
      length:
        hearts:
          min: 4
    call: 3H
    meaning: 'Limit raise: 10-12 HCP, 4+ hearts, invitational. [DEV: 10-11 in handbook]'
    promised:
      hcp:
        min: 10
        max: 12
      length:
        hearts:
          min: 4
  - id: r1h-2c
    conditions:
      hcp:
        min: 10
      length:
        clubs:
          min: 4
      compare:
      - left: clubs
        op: ge
        right: diamonds
    call: 2C
    meaning: 'New suit at the 2-level: 10+ HCP, clubs, forcing one round.'
    promised:
      hcp:
        min: 10
      length:
        clubs:
          min: 4
  - id: r1h-2d
    conditions:
      hcp:
        min: 10
      length:
        diamonds:
          min: 4
    call: 2D
    meaning: 'New suit at the 2-level: 10+ HCP, diamonds, forcing one round.'
    promised:
      hcp:
        min: 10
      length:
        diamonds:
          min: 4
  - id: r1h-2h
    conditions:
      hcp:
        min: 6
        max: 9
      length:
        hearts:
          min: 3
    call: 2H
    meaning: 'Simple raise: 6-9 HCP, 3+ hearts.'
    promised:
      hcp:
        min: 6
        max: 9
      length:
        hearts:
          min: 3
  - id: r1h-1nt
    conditions:
      hcp:
        min: 6
        max: 10
      length:
        hearts:
          max: 2
    call: 1NT
    meaning: 6-10 HCP, denies 3-card heart support, semi-forcing.
    promised:
      hcp:
        min: 6
        max: 10
      length:
        hearts:
          max: 2
  - id: r1h-4h
    conditions:
      hcp:
        max: 8
      length:
        hearts:
          min: 5
    call: 4H
    meaning: 'Pre-emptive raise to game: weak hand, 5+ hearts.'
    promised:
      hcp:
        max: 8
      length:
        hearts:
          min: 5
  - id: r1h-pass
    conditions:
      hcp:
        max: 5
    call: Pass
    meaning: Too weak to respond.
    promised:
      hcp:
        max: 5
