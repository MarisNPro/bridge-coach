# Opener's rebid after a 1-over-1 response (uncontested). Section 4 of the
# handbook: the opener-rebid tree. Each situation is opener's SECOND call after
# partner responded a new suit at the 1 level. Strength bands for a suit opener:
# 12-14 / 18-19 balanced rebid 1NT / 2NT (15-17 balanced opened 1NT, 20-21 2NT);
