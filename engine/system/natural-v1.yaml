  rules:
  - id: r1s-jacoby2nt
    conditions:
      hcp:
        min: 13
      length:
        spades:
          min: 4
    call: 2NT
    meaning: 'Jacoby 2NT: game-forcing, 4+ spades.'
    promised:
      hcp:
        min: 13
      length:
        spades:
          min: 4
  - id: r1s-3s
    conditions:
      hcp:
        min: 10
        max: 12
      length:
        spades:
          min: 4
    call: 3S
    meaning: 'Limit raise: 10-12 HCP, 4+ spades, invitational. [DEV: 10-11 in handbook]'
    promised:
      hcp:
        min: 10
        max: 12
      length:
        spades:
          min: 4
  - id: r1s-2h
    conditions:
      hcp:
        min: 10
      length:
        hearts:
          min: 4
      compare:
      - left: hearts
        op: ge
        right: diamonds
      - left: hearts
        op: ge
        right: clubs
    call: 2H
    meaning: 'New suit at the 2-level: 10+ HCP, hearts, forcing one round.'
    promised:
      hcp:
        min: 10
      length:
        hearts:
          min: 4
  - id: r1s-2d
    conditions:
      hcp:
        min: 10
