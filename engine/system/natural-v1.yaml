# =====================================================================
# Responder after a 2-level SIMPLE suit overcall of partner's opening. Same
# negative-double framework as the 1-level matrix, one level up: the double
# shows the unbid major(s) (8+); over 1S-(2H), where both majors are bid, it is
# a takeout of the two minors. Other actions: cue the opponent's suit (3-level,
# game-forcing), 2NT with a stopper (invitational), raise partner, Pass. (Jump
# overcalls and 1C 2-level overcalls are weak-jump/preempt auctions, out of
# scope here.) Catch-all Pass keeps every hand covered (vet.py).
- id: resp-1d-over-2c
