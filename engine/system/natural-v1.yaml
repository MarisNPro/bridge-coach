- id: resp-1nt
  description: Responder after partner's 1NT (15-17), uncontested.
  when:
    seat: responder
    auction:
    - 1NT
    - Pass
  rules:
  - id: r1nt-transfer-hearts
    conditions:
      length:
        hearts:
          min: 5
      compare:
      - left: hearts
        op: ge
        right: spades
    call: 2D
    meaning: 'Jacoby transfer to hearts: 5+ hearts, any strength. Opener must bid 2H.'
    promised:
      length:
        hearts:
          min: 5
      transfer_to: hearts
  - id: r1nt-transfer-spades
    conditions:
      length:
        spades:
          min: 5
    call: 2H
    meaning: 'Jacoby transfer to spades: 5+ spades, any strength. Opener must bid 2S.'
    promised:
      length:
        spades:
          min: 5
      transfer_to: spades
  - id: r1nt-6nt
    conditions:
      hcp:
        min: 18
      balanced: true
    call: 6NT
    meaning: "18+ balanced opposite 15-17 \u2014 enough combined for slam, to play."
    promised:
      hcp:
        min: 18
      shape: balanced
  - id: r1nt-quant4nt
    conditions:
      hcp:
        min: 16
        max: 17
      balanced: true
    call: 4NT
    meaning: 'Quantitative (NOT Blackwood): invites 6NT. Opener passes minimum, bids on maximum.'
    promised:
      hcp:
        min: 16
        max: 17
      shape: balanced
  - id: r1nt-stayman
    conditions:
      hcp:
        min: 8
      four_card_major: true
    call: 2C
    meaning: 'Stayman: 8+ HCP with a 4-card major; asks opener for a 4-card major.'
    promised:
      hcp:
        min: 8
      asks: four_card_major
  - id: r1nt-3nt
    conditions:
      hcp:
        min: 10
        max: 15
      balanced: true
    call: 3NT
    meaning: "10-15 balanced, no 4-card major or 5-card major \u2014 to play."
    promised:
      hcp:
        min: 10
        max: 15
      shape: balanced
  - id: r1nt-2nt
    conditions:
      hcp:
        min: 8
        max: 9
      balanced: true
    call: 2NT
    meaning: "8-9 balanced \u2014 invites 3NT."
    promised:
      hcp:
        min: 8
        max: 9
      shape: balanced
  - id: r1nt-pass
    conditions:
      hcp:
        max: 7
    call: Pass
    meaning: "0-7, no long major \u2014 leave it in 1NT."
    promised:
      hcp:
        max: 7
  # Catch-alls for an unbalanced no-major hand (typically a long minor). Appended
  # so transfers/Stayman/NT bids always win first (see vet.py \u2014 no null calls).
  - id: r1nt-3nt-longminor
    conditions:
      hcp:
        min: 10
    call: 3NT
    meaning: "10+ HCP, no four-card major \u2014 to play 3NT. A long minor is a source of tricks, not a reason to dodge game."
    promised:
      hcp:
        min: 10
  - id: r1nt-2nt-invite-catchall
    conditions: {}
    call: 2NT
    meaning: "8-9 HCP, no four-card major \u2014 invitational; opener passes a minimum, bids 3NT with a maximum."
    promised:
      hcp:
        min: 8
        max: 9
- id: opener-after-stayman
  description: Opener answers Stayman.
  when:
    seat: opener
    auction:
    - 1NT
    - Pass
    - 2C
    - Pass
  rules:
  - id: stay-2h
    conditions:
      length:
        hearts:
          min: 4
    call: 2H
    meaning: Shows 4+ hearts (bids hearts first if 4-4 in the majors).
    promised:
      length:
        hearts:
          min: 4
  - id: stay-2s
    conditions:
      length:
        spades:
          min: 4
    call: 2S
    meaning: Shows 4 spades, denies 4 hearts.
    promised:
      length:
        spades:
          min: 4
      denies:
        four_hearts: true
  - id: stay-2d
    conditions: {}
    call: 2D
    meaning: No 4-card major.
    promised:
      denies:
        four_card_major: true
- id: opener-accept-transfer-hearts
  description: Opener completes a transfer to hearts.
  when:
    seat: opener
    auction:
    - 1NT
    - Pass
    - 2D
    - Pass
  rules:
  - id: acc-2h
    conditions: {}
    call: 2H
    meaning: Mandatory transfer completion (says nothing extra).
    promised:
      transfer_completed: hearts
- id: opener-accept-transfer-spades
  description: Opener completes a transfer to spades.
  when:
    seat: opener
    auction:
    - 1NT
    - Pass
    - 2H
    - Pass
  rules:
  - id: acc-2s
    conditions: {}
    call: 2S
    meaning: Mandatory transfer completion.
    promised:
      transfer_completed: spades
# ---------------------------------------------------------------------
# Responder's placement after a 1NT auction (opener 15-17). After Stayman, a
# 4-4 major fit raises to invite (3M, 8-9) or game (4M, 10+); no fit goes to
# notrump (2NT invite / 3NT game). After a transfer, 6+ trumps invite (3M) or
# bid game (4M); exactly 5 offers a choice via 2NT / 3NT. Each ends in a {}
# Pass catch-all so the seat is always covered (vet.py).
- id: resp-after-stayman-2d
  description: Responder after Stayman, opener denies a 4-card major (2D).
  when:
    seat: responder
    auction:
    - 1NT
    - Pass
    - 2C
    - Pass
    - 2D
    - Pass
  rules:
  - id: ras-2d-3nt
    conditions:
      hcp:
        min: 10
    call: 3NT
    meaning: '10+ HCP, no major fit — to play 3NT.'
    promised:
      hcp:
        min: 10
  - id: ras-2d-2nt
    conditions:
      hcp:
        min: 8
        max: 9
    call: 2NT
    meaning: '8-9 HCP, invitational; opener passes a minimum.'
    promised:
      hcp:
        min: 8
        max: 9
  - id: ras-2d-pass
    conditions: {}
    call: Pass
    meaning: Minimum — settle in a partscore.
    promised: {}
- id: resp-after-stayman-2h
  description: Responder after Stayman, opener shows 4 hearts (2H).
  when:
    seat: responder
    auction:
    - 1NT
    - Pass
    - 2C
    - Pass
    - 2H
    - Pass
  rules:
  - id: ras-2h-4h
    conditions:
      hcp:
        min: 10
      length:
        hearts:
          min: 4
    call: 4H
    meaning: 'Game with a 4-4 heart fit: 10+ HCP, 4+ hearts.'
    promised:
      hcp:
        min: 10
      length:
        hearts:
          min: 4
  - id: ras-2h-3h
    conditions:
      hcp:
        min: 8
        max: 9
      length:
        hearts:
          min: 4
    call: 3H
    meaning: 'Invitational heart raise: 8-9 HCP, 4+ hearts.'
    promised:
      hcp:
        min: 8
        max: 9
  - id: ras-2h-3nt
    conditions:
      hcp:
        min: 10
    call: 3NT
    meaning: '10+ HCP, no heart fit — to play 3NT.'
    promised:
      hcp:
        min: 10
  - id: ras-2h-2nt
    conditions:
      hcp:
        min: 8
        max: 9
    call: 2NT
    meaning: '8-9 HCP, no fit — invitational.'
    promised:
      hcp:
        min: 8
        max: 9
  - id: ras-2h-pass
    conditions: {}
    call: Pass
    meaning: Minimum — settle in a partscore.
    promised: {}
